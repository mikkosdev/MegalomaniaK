plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation project(':framework')

    // Testing
    implementation("ch.qos.logback:logback-classic:1.5.15")

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    // Mockito for mock objects.
    testImplementation "org.mockito:mockito-core:3.+"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    implementation 'org.mikkosdev:mediatorj:1.0.0-SNAPSHOT'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'megalomaniak.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            useJUnitJupiter(libs.versions.junit.jupiter.get())

            dependencies {
                implementation project()
                implementation platform("org.junit:junit-bom:${libs.versions.junit.jupiter.get()}")
            }

            configurations.named(sources.implementationConfigurationName) {
                extendsFrom(configurations.testImplementation)
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.integrationTest
}

tasks.withType(Test).configureEach {
    // IntelliJ's Gradle runner builds the results tree only from test events.
    // An up-to-date task emits none, so the tree stays empty on a rerun.
    if (gradle.startParameter.taskRequests.any { request ->
        request.args.any { it == '--tests' || it.startsWith('--tests=') }
    }) {
        outputs.upToDateWhen { false }
    }
}
